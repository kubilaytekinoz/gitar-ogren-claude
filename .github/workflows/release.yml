name: Test ve sürüm

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Nota algılama testi
        run: node test/pitch.test.mjs
      - name: Şarkı ve ısınma dosyaları testi
        run: node test/validate-songs.mjs

  windows:
    needs: test
    # main'e her gönderimde çalışır; package.json'daki sürüm daha önce yayınlanmadıysa kurulum dosyası hazırlar
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bu sürüm yayınlandı mı?
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "v$VERSION zaten yayında, atlanıyor."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
      - uses: actions/setup-node@v4
        if: steps.check.outputs.skip == 'false'
        with:
          node-version: 22
      - if: steps.check.outputs.skip == 'false'
        run: npm install --no-audit --no-fund
      - name: Gerçekçi ses bankasını indir
        if: steps.check.outputs.skip == 'false'
        run: node scripts/fetch-soundfont.mjs
      - name: Windows kurulum dosyasını hazırla ve yayınla
        if: steps.check.outputs.skip == 'false'
        shell: bash
        run: |
          set -o pipefail
          npx electron-builder --win --publish always 2>&1 | tee build.log
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEBUG: electron-builder
      # Hata olursa kaydı ci-logs dalına koy (giriş yapmadan okunabilsin diye)
      - name: Hata kaydını sakla
        if: failure()
        shell: bash
        run: |
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          cp build.log /tmp/build.log 2>/dev/null || echo "kayıt yok" > /tmp/build.log
          git checkout --orphan ci-logs
          git rm -rf --cached . > /dev/null
          cp /tmp/build.log build.log
          git add build.log
          git commit -m "derleme kaydı ${GITHUB_SHA}"
          git push -f origin ci-logs
