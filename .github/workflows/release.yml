name: Test ve sürüm

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Nota algılama testi
        run: node test/pitch.test.mjs
      - name: Şarkı ve ısınma dosyaları testi
        run: node test/validate-songs.mjs

  windows:
    needs: test
    # main'e her gönderimde çalışır; package.json'daki sürümün kurulum dosyası yayında değilse hazırlar
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bu sürüm yayınlandı mı?
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          ASSETS=$(gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null || true)
          if echo "$ASSETS" | grep -qx "GitarOgren-Kurulum-$VERSION.exe" && echo "$ASSETS" | grep -qx "latest.yml"; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "v$VERSION zaten eksiksiz yayında, atlanıyor."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
      - uses: actions/setup-node@v4
        if: steps.check.outputs.skip == 'false'
        with:
          node-version: 22
      - if: steps.check.outputs.skip == 'false'
        run: npm install --no-audit --no-fund
      - name: Gerçekçi ses bankasını indir
        if: steps.check.outputs.skip == 'false'
        run: node scripts/fetch-soundfont.mjs
      - name: Windows kurulum dosyasını hazırla
        if: steps.check.outputs.skip == 'false'
        run: npx electron-builder --win --publish never
      - name: Sürümler sayfasına yükle
        if: steps.check.outputs.skip == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="${{ steps.check.outputs.version }}"
          ls -la dist
          FILES="dist/GitarOgren-Kurulum-$V.exe dist/GitarOgren-Kurulum-$V.exe.blockmap dist/latest.yml"
          if gh release view "v$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "v$V" $FILES --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "v$V" $FILES --title "$V" --notes "Gitar Öğren $V" --target "$GITHUB_SHA" --latest --repo "$GITHUB_REPOSITORY"
          fi
          gh release view "v$V" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | "\(.name) \(.size)"'
